name: Local prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/device
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --dev --extra mcp
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src tests
      - run: uv run pytest -q
      - run: uv build

  arm64-package:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/device
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          python-version: '3.13'
      - run: uv sync --frozen --dev --extra mcp --extra device
      - run: uv build

  secrets:
    # Scans every commit for leaked keys. Known non-secrets are allowed in .gitleaks.toml.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - run: $RUNNER_TEMP/gitleaks git . --no-banner --redact --config .gitleaks.toml

