name: Local prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/device
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --dev --extra mcp
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src tests
      - run: uv run pytest -q
      - run: uv build

  arm64-package:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: apps/device
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.13'
      - run: uv sync --frozen --dev --extra mcp --extra device
      - run: uv build

