name: Vouch - Manage by Issue

on:
  issue_comment:
    types: [created]

permissions: {}

# Serialize updates to .github/VOUCHED.td.
concurrency:
  group: vouch-manage
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vouch/* branch with the .github/VOUCHED.td change
      pull-requests: write # open the pull request into main, which a maintainer merges
      issues: write # reply on the vouch request issue
    if: >-
      !github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'vouch') ||
       contains(github.event.comment.body, 'denounce') ||
       contains(github.event.comment.body, 'unvouch'))
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, default branch, which holds .github/VOUCHED.td
      - uses: mitchellh/vouch/action/manage-by-issue@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          comment-id: ${{ github.event.comment.id }}
          issue-id: ${{ github.event.issue.number }}
          pull-request: true # main only accepts pull requests
        env:
          GH_TOKEN: ${{ github.token }}
