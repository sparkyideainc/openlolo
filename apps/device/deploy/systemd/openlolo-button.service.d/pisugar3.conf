# Lolo Pocket (Radxa ZERO 3W + PiSugar3): the button daemon reads the PiSugar3 top button over
# I2C instead of a GPIO pin and blinks the board's status LED (sysfs). Installed on Radxa only;
# the base unit stays the Raspberry Pi GPIO unit.
[Unit]
Description=OpenLolo top button (PiSugar3) and status LED
# openlolo-board.service makes the status LED writable for user openlolo.
After=openlolo-board.service
# Reset the GPIO condition; the daemon itself retries every 30 s while the I2C device is missing.
ConditionPathExists=

[Service]
# Empty assignments reset the GPIO-only settings of the base unit.
Environment=
Environment=OPENLOLO_BUTTON_BACKEND=pisugar3
Environment=OPENLOLO_I2C_BUS=3
SupplementaryGroups=
SupplementaryGroups=i2c
DeviceAllow=
DeviceAllow=/dev/i2c-3 rw
