# OpenLolo: keep the iPhone usable by usbmuxd.
# apple_mfi_fastcharge (shipped by Armbian, not by Raspberry Pi OS) binds the iPhone and puts it
# back into USB configuration 1 (PTP only) after the usbmuxd udev rule has selected the
# multiplexing configuration. usbmuxd then logs "Could not find a suitable USB interface"
# and never sees the phone.
blacklist apple_mfi_fastcharge
