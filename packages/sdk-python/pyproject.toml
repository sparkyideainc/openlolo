[project]
name = "openlolo-sdk"
version = "0.1.0"
description = "Script an iPhone through an OpenLolo box"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["httpx>=0.28,<1"]

[project.scripts]
openlolo-sdk = "openlolo_sdk.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "ty>=0.0.84,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["src", "tests"]
